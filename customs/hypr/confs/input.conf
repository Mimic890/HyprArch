#############
### INPUT ###
#############

input {
    kb_layout = us,ru
    kb_variant =
    kb_model = pc105
    kb_options = grp:win_space_toggle,caps:escape_shifted_capslock
    kb_rules =
    numlock_by_default = true
    follow_mouse = 1
    sensitivity = 0
    touchpad {
    	disable_while_typing = true
	    scroll_factor = 0.2
	    middle_button_emulation = true
        natural_scroll = true
        tap-to-click = true
    }
}
